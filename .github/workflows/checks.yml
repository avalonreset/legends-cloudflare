name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Release gate
        run: python scripts/check_release.py --root .
      - name: Install test tooling
        run: python -m pip install --upgrade "pip>=26.2.2" setuptools build
      - name: Test suite
        run: python -m unittest discover -s tests -v
      - name: Build wheel and sdist
        run: python -m build
      - name: Clean install outside checkout
        shell: bash
        run: python -m pip install dist/*.whl
      - name: Installed wheel mirror tests
        run: python -m unittest tests.test_packaging.WheelSmoke -v
      - name: Packaged CLI smoke outside checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          legends-cloudflare --version
          legends-cloudflare doctor
          python "$GITHUB_WORKSPACE/scripts/smoke_installed_resources.py"

  empire-attachment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build and install Cloudflare wheel
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade "pip>=26.2.2" build
          python -m build --wheel
          python -m pip install dist/*.whl
      - name: Check out pinned Empire engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: avalonreset/legends-empire
          # Immutable legends-empire 0.3.4 transaction engine.
          ref: 1ede96ad670b60b215b66457369691da6c61d017
          path: .integration/empire
      - name: Attach packaged knowledge on the native OS
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          legends-cloudflare resources > resources.json
          python - <<'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          info = json.load(open("resources.json"))
          assert info["source"] == "package_data", info["source"]
          pack = info["pack_manifest"]
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          subprocess.run([
              sys.executable,
              str(workspace / "scripts" / "verify_knowledge_attachment.py"),
              "--empire-source", str(workspace / ".integration" / "empire"),
              "--pack", pack,
          ], check=True)
          EOF
